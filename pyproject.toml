[project]
name = "idempotency-service-api"
version = "0.1.0"
description = "A small PostgreSQL-backed idempotency service API."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "samrms", email = "alcntara.samuel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.16.5",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
