services:
  - type: web
    name: idempotency-service-api
    runtime: docker
    branch: main
    autoDeploy: true
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: uv run alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idempotency-service-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false

databases:
  - name: idempotency-service-db
    databaseName: idempotency
    user: idempotency
    plan: free
