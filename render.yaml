services:
  - type: web
    name: idempotency-service-api
    runtime: docker
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite://
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
